[project]
name = "distylai-component-tree-kernels"
version = "0.1.0"
description = "Initial external component-tree kernels"
requires-python = ">=3.11"
dependencies = [
    "distylai-toolkit-component-tree-kernel-sdk>=0.3.0,<0.4.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kernels"]
